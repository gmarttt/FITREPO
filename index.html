<style>

.tg{width:52px;height:32px;border-radius:99px;background:#8885;position:relative;flex:none;transition:background .2s}.tg i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .2s}.tg.on{background:var(--ac)}.tg.on i{transform:translateX(20px)}
.wl{text-align:center;margin-bottom:14px;animation:pp .7s cubic-bezier(.2,1.6,.4,1) both}.wl span{display:block;font-size:18px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}.wl b{display:block;font-size:min(11vw,48px);font-weight:900;line-height:1.1;max-width:88vw;overflow-wrap:anywhere}
button.chip{border:0;font:inherit;font-size:14px;color:inherit;cursor:pointer}.chip.n{background:#8883}
textarea{-webkit-user-select:text;user-select:text}

#auth{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:calc(30px + env(safe-area-inset-top,0px)) 20px 40px}.acard{width:100%;max-width:380px}

#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}#splash svg{width:230px;max-width:70vw}#splash h1{margin-top:8px}

.tq{font-size:min(17vw,84px);font-weight:900;letter-spacing:-1px;line-height:1;margin-top:14px;color:var(--ac);animation:pp .7s cubic-bezier(.2,1.6,.4,1) both}@keyframes pp{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.day:active{transform:scale(.97)}
.day b{font-size:19px}.day small{opacity:.85}

.done .chk{background:var(--ac)}

.btn{background:var(--ac);color:var(--acfg);border-radius:14px;padding:12px 16px;font-weight:600;width:100%;margin-top:8px}
.btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.del{background:#ff453a;color:#fff}
.x{color:#ff453a;font-size:20px;padding:4px 8px}
.back{color:var(--ac);font-weight:600;padding:6px 0}
.sheet{position:fixed;inset:0;background:#0008;display:none;z-index:20}
.sheet.on{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;top:6%;background:var(--bg);border-radius:24px 24px 0 0;overflow:auto;padding:16px 18px calc(40px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.tabs{display:flex;gap:6px;background:var(--card);border-radius:12px;padding:4px;margin:12px 0}

.tabs .on{background:var(--ac);color:var(--acfg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:var(--mut);display:block;margin:8px 0 4px}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;outline:1px solid var(--line)}
.sw .sel{border-color:var(--fg)}
.met{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.met:last-child{border:0}.met span:first-child{color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.sets{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:52%}.set{width:36px;height:36px;border-radius:50%;border:2px solid var(--ac);font-weight:600;font-size:14px}.set.on{background:var(--ac);color:var(--acfg)}
.lp{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#pop{z-index:30}.pcard{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);max-width:480px;margin:0 auto;background:var(--bg);border-radius:22px;padding:18px;max-height:90vh;overflow:auto}.pcard h2{margin:0 0 8px;font-size:20px}
.menu button{display:block;width:100%;text-align:left;padding:15px 4px;border-bottom:1px solid var(--line);font-size:17px}
.wt{margin-top:6px;padding:4px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--ac);font-weight:600}
.hist{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--mut)}
.bd{fill:#8883}.mu{fill:#8885}.mu.on{fill:#ff3b30}.mu.on2{fill:#ff3b3099}
.chip{display:inline-block;padding:5px 11px;border-radius:99px;margin:3px 4px 3px 0;background:#ff3b3022;font-size:14px}.chip.p{background:#ff3b30;color:#fff}
#st{font-size:14px;color:var(--mut);margin-top:8px;white-space:pre-wrap}
</style>
</head>
<body>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script>
var ACC=["#0a84ff","#30d158","#ff9f0a","#ff453a","#bf5af2","#ff375f","#64d2ff","#8e8e93"];
var BGS=[["Auto",""],["Negro","#000000"],["Grafito","#1c1c1e"],["Azul noche","#0a1330"],["Verde bosque","#0b2418"],["Vino","#2a0f17"],["Blanco","#ffffff"],["Gris claro","#e5e5ea"]];
var S={days:[],theme:{ac:ACC[0],bg:""},me:{sex:"m",age:"",h:"",w:"",neck:"",waist:"",hip:"",act:"1.55"}};
var view={d:null},tab="look";
var AUTH=false,KEYN="entrenos.v1",USER=null,AM="in";
function load(){try{var j=localStorage.getItem(KEYN);if(j){var o=JSON.parse(j);S.days=o.days||[];S.theme=Object.assign(S.theme,o.theme);S.me=Object.assign(S.me,o.me);S.anim=o.anim||{};S.ts=o.ts||0;S.ticket=o.ticket||""}}catch(e){}
if(!localStorage.getItem&&0){}}

var $=function(i){return document.getElementById(i)};

function uid(){return Math.random().toString(36).slice(2,9)}
function lum(h){var n=parseInt(h.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return(.299*r+.587*g+.114*b)/255}

var keys=["--bg","--fg","--card","--mut","--line"];
if(t.bg){var l=lum(t.bg)>.5;r.setProperty("--bg",t.bg);r.setProperty("--fg",l?"#111":"#f4f4f7");r.setProperty("--card",l?"#ffffffcc":"#ffffff14");r.setProperty("--mut",l?"#555":"#b0b0bb");r.setProperty("--line",l?"#0002":"#fff2")}
else keys.forEach(function(k){r.removeProperty(k)});
var m=document.querySelector('meta[name=theme-color]');if(m)m.content="#0b0b0f";
try{var c=document.createElement("canvas");c.width=c.height=180;var x=c.getContext("2d");x.fillStyle=t.ac;x.fillRect(0,0,180,180);x.font="100px serif";x.textAlign="center";x.textBaseline="middle";x.fillText("🏋️",90,96);}catch(e){}icon()}
function render(){var a=$("app");
if(view.d){var d=S.days.find(function(x){return x.id===view.d});if(!d){view.d=null;return render()}
a.innerHTML='<button class="back" onclick="go(null)">‹ Inicio</button><header><div><h1>'+esc(d.name)+'</h1><div class="sub">'+esc(d.muscle)+'</div></div></header><div class="card" id="exs">'+
(d.ex.length?d.ex.map(function(e,i){var k=sets(e);return'<div class="row ex'+(full(e)?' done':'')+'"><div class="grow"><div class="nm lp" data-d="'+d.id+'" data-i="'+i+'"><b>'+esc(e.n)+'</b><div class="sub">'+esc(e.s)+' series × '+esc(e.r)+' reps</div></div><button class="wt" onclick="wp(\''+d.id+'\','+i+')">⚖️ '+(e.kg?esc(e.kg)+' kg':'Añadir peso')+'</button></div><div class="sets">'+k.map(function(v,j){return'<button class="set'+(v?' on':'')+'" onclick="ts(\''+d.id+'\','+i+','+j+')">'+(j+1)+'</button>'}).join("")+'</div></div>'}).join("")+'<div class="note">Toca cada serie al completarla · mantén pulsado un ejercicio para ver más opciones</div>':'<div class="empty">Sin ejercicios todavía</div>')+'</div>'+
'<div class="card"><label>Añadir ejercicio</label><input id="en" placeholder="Nombre (ej. Press banca)"><div class="g2"><div><label>Series</label><input id="es" type="number" inputmode="numeric" value="4"></div><div><label>Repeticiones</label><input id="er" value="10"></div></div><button class="btn" onclick="ax(\''+d.id+'\')">Añadir</button></div>'+
(d.ex.some(function(e){return sets(e).some(Boolean)})?'<button class="btn sec" onclick="reset(\''+d.id+'\')">Reiniciar marcas</button>':'');return}
var h='<header class="hh"><div></div>'+tkTile()+'<div style="display:flex;gap:10px;justify-self:end"><button class="icon" onclick="bkOpen()" aria-label="Copia de seguridad">💾</button><button class="icon" onclick="openS()" aria-label="Ajustes">⚙️</button></div></header><div class="sub" style="text-align:center;margin:0 0 16px">'+(S.days.length?"Elige tu día":"Configura tu rutina")+' · <span id="cl">'+ctxt()+'</span></div>';
h+=S.days.length?'<div class="grid">'+S.days.map(function(d){var n=d.ex.filter(full).length;return'<button class="day" onclick="go(\''+d.id+'\')"><b>'+esc(d.name)+'</b><span><div>'+esc(d.muscle)+'</div><small>'+n+'/'+d.ex.length+' ejercicios</small></span></button>'}).join("")+'</div>':'<div class="empty">Aún no hay días.<br>Abre ⚙️ → Rutina para crearlos o escanear tu plan.</div>';
if(!STD())h+='<div class="note" style="text-align:center;margin-top:22px">📲 Instálala: Compartir → «Añadir a pantalla de inicio» (iPhone) o menú ⋮ → «Instalar app» (Android)</div>';a.innerHTML=h}
function go(id){view.d=id;render();scrollTo(0,0)}
function D(id){return S.days.find(function(x){return x.id===id})}
function sets(e){var n=Math.max(1,Math.min(20,parseInt(e.s)||1));if(!Array.isArray(e.k)){e.k=[];for(var i=0;i<n;i++)e.k.push(!!e.done)}while(e.k.length<n)e.k.push(false);e.k.length=n;return e.k}
function full(e){return sets(e).every(Boolean)}
function ts(id,i,j){var d=D(id),was=d.ex.every(full),k=sets(d.ex[i]);k[j]=!k[j];save();render();if(!was&&d.ex.every(full))fin(d)}
function rx(id,i){D(id).ex.splice(i,1);save();render()}
function reset(id){D(id).ex.forEach(function(e){e.k=sets(e).map(function(){return false})});save();render()}
function ax(id){var n=$("en").value.trim();if(!n)return;D(id).ex.push({n:n,s:$("es").value||"3",r:$("er").value||"10",done:false});save();render()}
function openS(){$("sheet").classList.add("on");panel()}
function closeS(){$("sheet").classList.remove("on");render()}
$("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")closeS()});
function tabs(){return'<div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:24px">Ajustes</h1><button class="back" onclick="closeS()">Listo</button></div><div class="tabs">'+[["look","Apariencia"],["me","Mis datos"],["rut","Rutina"]].concat(AUTH?[["acc","Cuenta"]]:[]).map(function(t){return'<button class="'+(tab===t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';panel()">'+t[1]+'</button>'}).join("")+'</div>'}
function panel(){var p=$("panel"),h=tabs();
if(tab==="look"){h+=fxCard()+'<div class="card"><label>Color principal</label><div class="sw">'+ACC.map(function(c){return'<button class="'+(S.theme.ac===c?'sel':'')+'" style="background:'+c+'" onclick="setAc(\''+c+'\')"></button>'}).join("")+'</div><label>Color personalizado</label><input type="color" value="'+S.theme.ac+'" onchange="setAc(this.value)" style="height:44px;padding:4px"></div>'+
'<div class="card"><label>Fondo</label><div class="sw">'+BGS.map(function(b){return'<button class="'+(S.theme.bg===b[1]?'sel':'')+'" title="'+b[0]+'" style="background:'+(b[1]||'linear-gradient(135deg,#fff 50%,#000 50%)')+'" onclick="setBg(\''+b[1]+'\')"></button>'}).join("")+'</div><label>Fondo personalizado</label><input type="color" value="'+(S.theme.bg||"#000000")+'" onchange="setBg(this.value)" style="height:44px;padding:4px"></div>'}
if(tab==="me"){var m=S.me;h+=tkCard()+'<div class="card"><label style="margin-top:0">Nombre de usuario</label><input value="'+esc(m.name||"")+'" placeholder="Opcional" maxlength="24" autocapitalize="words" oninput="snm(this.value)"><div class="note">Si lo añades, aparecerá como mensaje de bienvenida al abrir la app.</div></div><div class="card"><div class="g2"><div><label>Sexo</label><select onchange="sm(\'sex\',this.value)"><option value="m"'+(m.sex==="m"?" selected":"")+'>Hombre</option><option value="f"'+(m.sex==="f"?" selected":"")+'>Mujer</option></select></div>'+fld("age","Edad (años)")+fld("h","Estatura (cm)")+fld("w","Peso (kg)")+fld("neck","Cuello (cm)")+fld("waist","Cintura (cm)")+(m.sex==="f"?fld("hip","Cadera (cm)"):"")+'<div><label>Actividad</label><select onchange="sm(\'act\',this.value)">'+[["1.2","Sedentario"],["1.375","Ligera (1-3 d/sem)"],["1.55","Moderada (3-5)"],["1.725","Alta (6-7)"],["1.9","Muy alta"]].map(function(o){return'<option value="'+o[0]+'"'+(m.act===o[0]?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select></div></div></div><div class="card" id="met">'+metrics()+'</div><div class="note">Cuello, cintura (y cadera en mujeres) permiten el método de la Marina de EE. UU., más preciso para la grasa corporal que el basado solo en IMC. Son estimaciones, no un diagnóstico médico.</div>'}
if(tab==="rut"){h+=rtCard()+aiCard()+'<div class="card">'+(S.days.length?S.days.map(dayRow).join(""):'<div class="empty">Sin días</div>')+'</div><div class="card"><label>Nuevo día</label><input id="nn" placeholder="Nombre (ej. Día 1)"><label>Grupo muscular</label><input id="nm" placeholder="ej. Pecho y tríceps"><button class="btn" onclick="nd()">Añadir día</button></div>'+(S.days.length?'<button class="btn del" onclick="clr()">Vaciar rutina completa</button>':'')}
if(tab==="acc")h+=accTab();p.innerHTML=h}
function fld(k,l){return'<div><label>'+l+'</label><input type="number" inputmode="decimal" step="any" value="'+esc(S.me[k])+'" oninput="sm(\''+k+'\',this.value,1)"></div>'}

function setAc(c){S.theme.ac=c;save();apply();panel()}
function setBg(c){S.theme.bg=c;save();apply();panel()}

function nd(){var n=$("nn").value.trim()||("Día "+(S.days.length+1)),id=uid();S.days.push({id:id,name:n,muscle:$("nm").value.trim()||"Sin definir",ex:[]});OPEN[id]=true;save();pnl()}
function metrics(){var m=S.me,a=+m.age,h=+m.h,w=+m.w,n=+m.neck,c=+m.waist,hp=+m.hip,male=m.sex==="m";
if(!(h>0&&w>0))return'<div class="empty">Introduce estatura y peso</div>';
var r=[],hm=h/100,bmi=w/(hm*hm),cat=bmi<18.5?"Bajo peso":bmi<25?"Normopeso":bmi<30?"Sobrepeso":bmi<35?"Obesidad I":bmi<40?"Obesidad II":"Obesidad III";
r.push(["IMC",bmi.toFixed(1)+" · "+cat]);
r.push(["Peso saludable (IMC 18,5–24,9)",(18.5*hm*hm).toFixed(1)+" – "+(24.9*hm*hm).toFixed(1)+" kg"]);

var AIP="Convierte la rutina de gimnasio que te adjunto (PDF, capturas o fotos) al formato de la app FITFAT. Léela entera.\n\nResponde SOLO con un bloque de código JSON válido, con exactamente este formato (sin texto antes). Después del bloque puedes añadir UNA línea con las dudas, si las hubiera.\n\n{\n \"app\": \"FITFAT\",\n \"v\": 1,\n \"datos\": {\n  \"days\": [\n   {\n    \"id\": \"d1\",\n    \"name\": \"Día 1\",\n    \"muscle\": \"Pecho y tríceps\",\n    \"ex\": [\n     { \"n\": \"Press banca\", \"s\": \"4\", \"r\": \"8-10\" },\n     { \"n\": \"Aperturas en polea\", \"s\": \"3\", \"r\": \"12\" }\n    ]\n   },\n   {\n    \"id\": \"d2\",\n    \"name\": \"Día 2\",\n    \"muscle\": \"Espalda y bíceps\",\n    \"ex\": [\n     { \"n\": \"Dominadas\", \"s\": \"4\", \"r\": \"al fallo\" }\n    ]\n   }\n  ]\n }\n}\n\nReglas:\n1. Un elemento de \"days\" por cada día de entrenamiento, en el orden original. \"id\": d1, d2, d3... \"name\": el nombre del día como aparece (Día 1, Lunes...). \"muscle\": el grupo muscular principal del día; si no aparece, deduce el más lógico.\n2. En \"ex\", un elemento por ejercicio: \"n\" = nombre en español, \"s\" = número de series (solo el número, entre comillas), \"r\" = repeticiones como texto (\"12\", \"8-10\", \"al fallo\", \"30 s\").\n3. Si una línea contiene varios ejercicios (biseries o superseries, unidos con +, / o \"y\"), crea un ejercicio SEPARADO por cada uno. Repite en cada uno las series y repeticiones de la línea, salvo que cada ejercicio traiga las suyas. Nunca juntes dos ejercicios en un solo nombre.\n4. \"s\" son las series de ESE ejercicio, no el número de ejercicios de la línea. No cuentes series de calentamiento o aproximación indicadas aparte.\n5. Si hay pirámides (ej. 12-10-8-6), pon en \"s\" cuántas series son y en \"r\" la secuencia.\n6. Mantén el orden original. No inventes días ni ejercicios que no estén en la rutina. Si algo es ambiguo, haz tu mejor interpretación y anótalo en la línea de dudas.\n7. JSON estricto: comillas dobles, sin comentarios y sin comas al final.";

function splashOld(){var s=document.createElement("div");s.id="splash";s.innerHTML='<svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" style="color:var(--fg)"><circle cx="100" cy="58" r="11"/><line x1="100" y1="71" x2="100" y2="126"/><line x1="100" y1="126" x2="84" y2="176"/><line x1="100" y1="126" x2="116" y2="176"/><line x1="100" y1="84" x2="68" y2="98"><animate attributeName="y2" values="98;52;98" dur="1.6s" repeatCount="indefinite"/></line><line x1="100" y1="84" x2="132" y2="98"><animate attributeName="y2" values="98;52;98" dur="1.6s" repeatCount="indefinite"/></line><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -46;0 0" dur="1.6s" repeatCount="indefinite"/><line x1="30" y1="98" x2="170" y2="98" stroke-width="6"/><line x1="40" y1="80" x2="40" y2="116" stroke="var(--ac)" stroke-width="11"/><line x1="160" y1="80" x2="160" y2="116" stroke="var(--ac)" stroke-width="11"/></g><line x1="50" y1="182" x2="150" y2="182" stroke-width="4" opacity=".4"/></svg><h1>Mis Entrenos</h1>';
document.body.appendChild(s);var out=function(){s.style.opacity=0;setTimeout(function(){s.remove()},500)};s.onclick=out;setTimeout(out,2300)}
/* ---- Confirmación propia (confirm() no funciona en esta página) ---- */
var CF=null;
function ask(msg,fn){CF=fn;pop('<h2>Confirmar eliminación</h2><div style="margin:6px 0 10px">'+msg+'</div><div class="note" style="margin:0 0 6px">Esta acción no se puede deshacer.</div><button class="btn del" onclick="var f=CF;CF=null;cp();if(f)f()">Sí, eliminar</button>')}
function clr(){var n=S.days.length;ask('Se borrarán los '+n+' días de tu rutina con todos sus ejercicios, pesos e historial.',function(){S.days=[];save();panel()})}
/* ---- Ejercicios desde Ajustes → Rutina ---- */
var OPEN={};
function pnl(){var p=$("panel"),y=p.scrollTop;panel();p.scrollTop=y}
function tgDay(id){OPEN[id]=!OPEN[id];pnl()}
function dayRow(d){var o=OPEN[d.id];return'<div class="row" style="display:block"><div style="display:flex;gap:10px;align-items:center"><div class="grow"><input value="'+esc(d.name)+'" onchange="dn(\''+d.id+'\',\'name\',this.value)" style="margin-bottom:6px"><input value="'+esc(d.muscle)+'" placeholder="Grupo muscular" onchange="dn(\''+d.id+'\',\'muscle\',this.value)"></div><button class="x" onclick="dd(\''+d.id+'\')">🗑</button></div><button class="btn sec" style="margin-top:8px" onclick="tgDay(\''+d.id+'\')">'+(o?'▾ Ocultar ejercicios':'▸ Ejercicios ('+d.ex.length+')')+'</button>'+(o?exEd(d):'')+'</div>'}
function exEd(d){var g='display:grid;grid-template-columns:1fr 56px 66px 34px;gap:6px;align-items:center;margin-top:8px';
var h='<div class="note" style="'+g+';margin-bottom:0"><span>Ejercicio</span><span>Series</span><span>Reps</span><span></span></div>';
d.ex.forEach(function(e,i){h+='<div style="'+g+'"><input value="'+esc(e.n)+'" onchange="ee(\''+d.id+'\','+i+',\'n\',this)"><input type="number" inputmode="numeric" value="'+esc(e.s)+'" onchange="ee(\''+d.id+'\','+i+',\'s\',this)"><input value="'+esc(e.r)+'" onchange="ee(\''+d.id+'\','+i+',\'r\',this)"><button class="x" onclick="er(\''+d.id+'\','+i+')">✕</button></div>'});
if(!d.ex.length)h+='<div class="note">Aún no hay ejercicios en este día.</div>';
return h+'<label style="margin-top:14px">Añadir ejercicio</label><div style="'+g.replace('34px','0px').replace('gap:6px','gap:6px;margin-top:0')+'"><input id="an_'+d.id+'" placeholder="Nombre (ej. Press banca)"><input id="as_'+d.id+'" type="number" inputmode="numeric" value="3"><input id="ar_'+d.id+'" value="10"><span></span></div><button class="btn" style="margin-top:8px" onclick="ea(\''+d.id+'\')">＋ Añadir ejercicio</button>'}
function ee(id,i,k,el){var e=D(id).ex[i],v=el.value.trim();
if(k==="n"){if(!v){el.value=e.n;return}e.n=v;el.value=v}
else if(k==="s"){e.s=String(Math.max(1,Math.min(20,parseInt(v)||1)));el.value=e.s;sets(e)}
else{e.r=v||"10";el.value=e.r}
save()}
function er(id,i){var e=D(id).ex[i];ask('¿Eliminar «'+esc(e.n)+'»?',function(){D(id).ex.splice(i,1);save();pnl()})}
function ea(id){var inp=$("an_"+id),n=inp.value.trim();if(!n){inp.focus();return}
var s=String(Math.max(1,Math.min(20,parseInt($("as_"+id).value)||3))),r=$("ar_"+id).value.trim()||"10";
splitN(n).forEach(function(x){D(id).ex.push({n:x,s:s,r:r,done:false})});save();pnl();var f=$("an_"+id);if(f)f.focus()}
/* ---- Pegar la rutina que genera la IA (Ajustes → Rutina) ---- */
function splitN(n){return String(n||"Ejercicio").split(/\s*\+\s*|\s+\/\s+/).filter(Boolean)}
function splitEx(){var d=D(cur.id),e=EX(),p=splitN(e.n);d.ex.splice.apply(d.ex,[cur.i,1].concat(p.map(function(n){return{n:n,s:e.s,r:e.r,k:[]}})));save();cp();render()}
function st(t){var e=$("st");if(e)e.textContent=t}
var RT=null;
function rtCard(){return'<div class="card"><b>Pegar rutina de tu IA</b><div class="note" style="margin:4px 0 8px">Pega aquí el código que te dio ChatGPT, Gemini o Claude y confirma para guardarlo.</div><textarea id="rtt" rows="6" style="width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px" placeholder="{ ... }" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea><button class="btn sec" onclick="rtPaste()">📋 Pegar texto</button><button class="btn" onclick="rtConfirm()">✅ Confirmar y guardar</button><div id="st" class="note"></div></div>'}
async function rtPaste(){var ta=$("rtt");try{if(navigator.clipboard&&navigator.clipboard.readText){var t=await navigator.clipboard.readText();if(t&&t.trim()){ta.value=t;st("✓ Texto pegado. Pulsa «Confirmar y guardar».");return}}}catch(e){}ta.focus();st("Mantén pulsado el cuadro y elige «Pegar».")}
function rtParse(t){try{var a=t.indexOf("{"),z=t.lastIndexOf("}"),o=JSON.parse(t.slice(a,z+1)),x=o.datos||o;if(!Array.isArray(x.days)||!x.days.length)return null;return fixDays(x.days)}catch(e){return null}}
function rtConfirm(){var t=($("rtt").value||"").trim();if(!t){st("Primero pega el texto de tu IA.");return}var d=rtParse(t);if(!d){st("No he podido leer ese texto. Copia el bloque entero que te dio la IA.");return}RT=d;var n=d.reduce(function(q,x){return q+x.ex.length},0),has=S.days.length>0;
pop('<h2>Revisa tu rutina</h2><div style="margin:6px 0 10px">Se han detectado <b>'+d.length+' días</b> y '+n+' ejercicios:</div><div style="max-height:42vh;overflow:auto">'+d.map(function(x){return'<b>'+esc(x.name)+'</b> <span class="sub">'+esc(x.muscle)+'</span>'+x.ex.map(function(e){return'<div class="hist"><span>'+esc(e.n)+'</span><b>'+esc(e.s)+' × '+esc(e.r)+'</b></div>'}).join("")+'<div style="height:10px"></div>'}).join("")+'</div>'+(has?'<div class="note">Ya tienes '+S.days.length+' días guardados. ¿Qué quieres hacer?</div><button class="btn" onclick="rtApply(false)">Añadir a mis días</button><button class="btn del" onclick="rtApply(true)">Reemplazar mi rutina</button>':'<button class="btn" onclick="rtApply(true)">Guardar rutina</button>'))}
function rtApply(rep){var d=RT.map(function(x){return{id:uid(),name:x.name,muscle:x.muscle,ex:x.ex}});S.days=rep?d:S.days.concat(d);save();cp();panel();render();st("✓ Rutina guardada: "+d.length+" días.")}
boot();
</script>
</body>
